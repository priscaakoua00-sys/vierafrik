<!doctype html>
<html lang="fr" style="background:#010306;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#010306" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="VierAfrik" />

    <!-- SEO -->
    <title>VierAfrik — Gestion Business Africain</title>
    <meta name="description" content="Application de gestion pour entrepreneurs africains. Factures PDF, clients, Mobile Money, Coach IA." />
    <meta name="keywords" content="gestion business afrique, facturation, mobile money, entrepreneur africain" />

    <!-- Open Graph -->
    <meta property="og:title" content="VierAfrik — Gestion Business Africain" />
    <meta property="og:description" content="Gérez votre business africain avec factures PDF, Mobile Money, Coach IA." />
    <meta property="og:url" content="https://vierafrik.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VierAfrik" />
    <!-- Bandeau visuel (pas juste l'icône carrée) affiché quand le lien est
         partagé sur WhatsApp, Facebook, LinkedIn ou repris dans les résultats Google. -->
    <meta property="og:image" content="https://vierafrik.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VierAfrik — Gestion Business Africain" />
    <meta name="twitter:description" content="Gérez votre business africain avec factures PDF, Mobile Money, Coach IA." />
    <meta name="twitter:image" content="https://vierafrik.com/og-image.png" />

    <!-- Apple Touch Icons -->
    <!-- FIX — icon-96x96.png et icon-72x72.png n'existent pas dans /public,
         ce qui cassait le favicon (aucun logo dans l'onglet du navigateur). -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="shortcut icon" href="/icon-192x192.png" />
    <link rel="canonical" href="https://vierafrik.com/" />

    <!-- SEO structuré, Google affiche prix / description directement dans les résultats -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "VierAfrik",
      "url": "https://vierafrik.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "Application de gestion pour entrepreneurs africains : factures PDF, suivi clients, encaissement Mobile Money (Orange, MTN, Wave), Coach IA. 100% en français.",
      "inLanguage": "fr",
      "image": "https://vierafrik.com/og-image.png",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "5"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "XOF",
          "description": "10 transactions, 3 clients, 2 factures"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "4900",
          "priceCurrency": "XOF",
          "priceValidUntil": "2027-12-31",
          "description": "Transactions, clients et factures illimités, PDF, WhatsApp, Mobile Money, Coach IA"
        },
        {
          "@type": "Offer",
          "name": "Business",
          "price": "9900",
          "priceCurrency": "XOF",
          "priceValidUntil": "2027-12-31",
          "description": "Tout Pro + équipe illimitée avec rôles et Mode Staff, mise en avant réseau, statistiques avancées"
        }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Qu'est-ce que VierAfrik ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VierAfrik est une application de gestion pour entrepreneurs et commerçants africains : ventes, dépenses, factures PDF automatiques, suivi clients et encaissement Mobile Money."
          }
        },
        {
          "@type": "Question",
          "name": "Est-ce que VierAfrik fonctionne avec le Mobile Money ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, VierAfrik permet d'encaisser directement via Orange Money, MTN Mobile Money et Wave."
          }
        },
        {
          "@type": "Question",
          "name": "Combien coûte VierAfrik ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "VierAfrik propose un plan gratuit, un plan Pro à 4 900 FCFA/mois et un plan Business à 9 900 FCFA/mois avec gestion d'équipe."
          }
        },
        {
          "@type": "Question",
          "name": "Puis-je vendre en ligne avec VierAfrik ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui, chaque commerçant peut publier une boutique en ligne partageable avec suivi de stock, et recevoir des commandes directement sur WhatsApp."
          }
        }
      ]
    }
    </script>

    <!-- Fix fond blanc -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #010306; }
      body {
        background: #010306 !important;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      #root {
        background: #010306;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
